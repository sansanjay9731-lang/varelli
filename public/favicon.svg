<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E8B2" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9A7B4F" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#C5A880" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9A7B4F" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background with subtle dark luxury sheen -->
  <rect width="512" height="512" rx="112" fill="#08080A" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Architectural Luxury Golden V -->
  <!-- Left Serif / Stem -->
  <polygon points="110,128 200,128 276,336 200,336" fill="url(#goldGrad)" opacity="0.95" />
  <!-- Main Bold Right Downstroke -->
  <polygon points="110,128 184,128 284,374 256,412 216,412" fill="url(#goldGrad)" />
  <!-- Full Architectural Golden V Form -->
  <path d="M 108 136 L 196 136 L 256 324 L 316 136 L 404 136 L 294 404 C 284 428 268 436 256 436 C 244 436 228 428 218 404 Z" fill="url(#goldGrad)" />
  
  <!-- Chiseled Edge Highlight for 3D metallic feel -->
  <path d="M 108 136 L 196 136 L 256 324 L 256 436 C 244 436 228 428 218 404 Z" fill="url(#goldShine)" />
</svg>
